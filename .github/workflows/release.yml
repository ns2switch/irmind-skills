name: Publish signed skill catalog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-production-release
  cancel-in-progress: false
jobs:
  validate:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.config.outputs.tag }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Validate immutable public release configuration
        id: config
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_config.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ns2switch/irmind
          ref: ${{ needs.validate.outputs.irmind_commit }}
          path: irmind
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with: {toolchain: '${{ needs.validate.outputs.toolchain }}'}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: irmind -> target
          shared-key: skills-compiler
          save-if: false
      - name: Build reviewed compiler and production signer without credentials
        run: |
          cp tools/production_signer.rs irmind/crates/bin/examples/catalog_sign.rs
          cargo build --manifest-path irmind/Cargo.toml -p irmind --example validate_skill --example catalog_sign --all-features --profile ci --locked
      - name: Build the catalog-only index
        env:
          KEY_ID: ${{ steps.config.outputs.key_id }}
          SEQUENCE: ${{ steps.config.outputs.release_sequence }}
        run: |
          python3 -B tools/build_index.py --compiler irmind/target/ci/examples/validate_skill --output dist --key-id "$KEY_ID" --tag "$GITHUB_REF_NAME" --sequence "$SEQUENCE" --commit "$GITHUB_SHA"
          mkdir signer
          cp irmind/target/ci/examples/catalog_sign signer/
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: catalog
          format: spdx-json
          output-file: dist/skills-SBOM.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: unsigned-catalog, path: dist/, if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: reviewed-signer, path: signer/, if-no-files-found: error}
  publish:
    needs: [validate, prepare]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: unsigned-catalog, path: dist}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: reviewed-signer, path: signer}
      - name: Validate the public release again before requesting the seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/release_config.py
      - name: Sign index in memory and verify its public identity
        env:
          CATALOG_ED25519_SEED_HEX: ${{ secrets.CATALOG_ED25519_SEED_HEX }}
        run: |
          set +x
          ulimit -c 0
          chmod 700 signer/catalog_sign
          signer/catalog_sign dist/index.json dist/index.ed25519
      - name: Verify Ed25519 independently and prepare checksums
        run: |
          python3 -B tools/verify_release.py --directory dist --ed25519-only
          python3 - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root=Path('dist')
          files=sorted(p for p in root.iterdir() if p.is_file())
          (root/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files),encoding='ascii')
          PYTHON
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'dist/*'}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.4}
      - name: Sign and verify all payloads and SHA256SUMS
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          for file in dist/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob "$file" --bundle "$file.sigstore.json" --certificate-identity "$EXPECTED_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - name: Publish immutable catalog assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "IRMind skill catalog $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
