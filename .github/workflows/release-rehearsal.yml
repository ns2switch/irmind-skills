name: Catalog release rehearsal (synthetic key only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  sign-rehearsal:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ns2switch/irmind
          ref: ${{ needs.validate.outputs.irmind_commit }}
          path: irmind
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with: {toolchain: '${{ needs.validate.outputs.toolchain }}'}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: irmind -> target
          shared-key: skills-compiler
          save-if: false
      - name: Build development compiler and fixed synthetic signer
        run: |
          cp tools/synthetic_signer.rs irmind/crates/bin/examples/catalog_sign.rs
          cargo build --manifest-path irmind/Cargo.toml -p irmind --example validate_skill --example catalog_sign --all-features --profile ci --locked
      - name: Build and verify a catalog-only synthetic index
        run: |
          mkdir dist
          key_id=$(irmind/target/ci/examples/catalog_sign | python3 -c 'import json,sys; print(json.load(sys.stdin)["key_id"])')
          python3 -B tools/build_index.py --compiler irmind/target/ci/examples/validate_skill --output dist --key-id "$key_id" --commit "$GITHUB_SHA"
          irmind/target/ci/examples/catalog_sign dist/index.json dist/index.ed25519
          printf '%s\n' 'SYNTHETIC REHEARSAL ONLY. This key is public test material and is not trusted by IRMind.' > dist/SYNTHETIC-ONLY.txt
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/skills-SBOM.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
      - name: Check all rehearsal payload checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file() and p.name != 'SHA256SUMS' and not p.name.endswith('.sigstore.json'))
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files), encoding='ascii')
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: 'dist/*'}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.4}
      - name: Sign and verify rehearsal artifacts against this workflow identity
        env:
          EXPECTED_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          for file in dist/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            cosign verify-blob "$file" --bundle "$file.sigstore.json" --certificate-identity "$EXPECTED_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-synthetic-rehearsal
          path: dist/
          if-no-files-found: error
          retention-days: 7
