name: Verify published catalog on native platforms
on:
  workflow_dispatch:
    inputs:
      irmind_tag:
        type: string
        required: true
        default: v0.5.4
      catalog_tag:
        type: string
        required: true
        default: v0.1.0
permissions:
  contents: read
  attestations: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Freeze the published IRMind source and validate exact tags
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IRMIND_TAG: ${{ inputs.irmind_tag }}
          CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: |
          python3 - <<'PYTHON'
          import json,os,re,subprocess
          for name in ('IRMIND_TAG','CATALOG_TAG'):
              if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9.-]+)?',os.environ[name]):raise ValueError('invalid tag')
          repo='repos/ns2switch/irmind/'
          release=json.loads(subprocess.check_output(['gh','api',repo+'releases/tags/'+os.environ['IRMIND_TAG']]))
          if release['draft']:raise ValueError('IRMind release is not published')
          commit=json.loads(subprocess.check_output(['gh','api',repo+'commits/'+os.environ['IRMIND_TAG']]))['sha']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('commit='+commit+'\n')
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ns2switch/irmind
          ref: ${{ steps.source.outputs.commit }}
          path: irmind
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with: {toolchain: 1.95.0}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: irmind -> target
          shared-key: skills-compiler
          save-if: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.4}
      - name: Verify and install the published IRMind executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IRMIND_TAG: ${{ inputs.irmind_tag }}
        working-directory: irmind
        run: python3 .github/scripts/audit_release_install.py --tag "$IRMIND_TAG"
      - name: Independently verify the exact catalog release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: |
          gh release download "$CATALOG_TAG" -R ns2switch/irmind-skills -D verified-catalog
          python3 -B tools/verify_release.py --directory verified-catalog
      - name: Exercise the published binary's preview, admission and complete case
        shell: bash
        env:
          IRMIND_CATALOG_TAG: ${{ inputs.catalog_tag }}
        run: |
          cp tools/catalog_release_pty.rs irmind/crates/bin/tests/catalog_release_pty.rs
          export IRMIND_CATALOG_PTY_BINARY="$IRMIND_DEMO_PTY_BINARY"
          export IRMIND_SKILLS_REPOSITORY="$PWD"
          cargo test --manifest-path irmind/Cargo.toml -p irmind --test catalog_release_pty --all-features --profile ci --locked -- --nocapture
